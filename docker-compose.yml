services:
  monitor:
    build: .
    container_name: monitor-consoles
    restart: unless-stopped
    env_file: .env            # ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
    environment:
      - TZ=America/Sao_Paulo  # logs no horário de Brasília (evita warning do tzlocal)
    # VPS pequeno (~1 GB RAM): /dev/shm modesto. O Chrome usa --disable-dev-shm-usage
    # (escreve em /tmp), então shm grande é desnecessário e perigoso aqui.
    shm_size: "256mb"
    volumes:
      - ./data:/app/data      # persiste o banco (histórico de preços) entre reinícios
    # Sem portas expostas: o serviço só faz requisições de saída.
