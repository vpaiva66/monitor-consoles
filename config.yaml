region:
  region_path: "estado-mg/belo-horizonte-e-regiao/pampulha"
  category_path: "/games"

searches:
  - { model: "Nintendo 3DS",    query: "nintendo 3ds" }
  - { model: "Nintendo DS",     query: "nintendo ds" }
  - { model: "Nintendo Switch", query: "nintendo switch" }
  - { model: "Xbox 360",        query: "xbox 360" }
  - { model: "Xbox One",        query: "xbox one" }
  - { model: "Xbox Series",     query: "xbox series" }
  - { model: "PS5",             query: "playstation 5" }
  - { model: "PS4",             query: "playstation 4" }
  - { model: "PS3",             query: "playstation 3" }
  - { model: "PS Vita",         query: "playstation vita" }
  - { model: "PSP",             query: "playstation portable" }

collector:
  headless: true
  browser_channel: "chrome"
  pages_per_search: 2
  min_delay_seconds: 4
  max_delay_seconds: 9
  nav_timeout_seconds: 45
  max_retries: 2

llm:
  enabled: true
  model: "claude-haiku-4-5"
  batch_size: 40
  api_key: ""

detector:
  min_discount_pct: 25
  min_samples: 8
  window_days: 30
  floor_ratio: 0.30

scheduler:
  interval_minutes: 180

telegram:
  enabled: true
  bot_token: ""
  chat_id: ""

storage:
  db_path: "data/listings.db"
  retention_days: 30
